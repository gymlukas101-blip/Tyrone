name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to publish releases on tags

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" numpy
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: ui

  windows:
    needs: test
    runs-on: windows-latest
    env:
      TYRONE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1.0-dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build UI
        working-directory: ui
        run: npm ci && npm run build

      - name: Install Python dependencies
        run: pip install ".[desktop,dev]"

      - name: Bundle the fallback wake word model (hey_jarvis) + feature models
        run: python -c "import openwakeword.utils as u; u.download_models(model_names=['hey_jarvis'])"

      - name: Unit tests (Windows)
        run: pytest -q

      - name: PyInstaller
        run: pyinstaller tyrone.spec --noconfirm

      - name: Self-test the built exe
        shell: pwsh
        run: |
          $env:TYRONE_SELFTEST_OUT = "$PWD\selftest.txt"
          $p = Start-Process -FilePath "dist\Tyrone\Tyrone.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\tyrone.iss

      - uses: actions/upload-artifact@v4
        with:
          name: TyroneSetup
          path: dist/installer/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
          generate_release_notes: true
