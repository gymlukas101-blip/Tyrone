name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to publish releases on tags

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" numpy sherpa-onnx sentencepiece
      - name: Download keyword-spotting model + test audio
        run: |
          curl -sL -o kws.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2
          tar xjf kws.tar.bz2
          mkdir -p wakeword/sherpa-kws
          M=sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
          cp -r $M/tokens.txt $M/bpe.model $M/*.int8.onnx $M/test_wavs wakeword/sherpa-kws/
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: ui

  windows:
    needs: test
    runs-on: windows-latest
    env:
      # Every build gets a unique, increasing version so Velopack can update installed copies.
      MONKEY_VERSION: 0.3.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build UI
        working-directory: ui
        run: npm ci && npm run build

      - name: Install Python dependencies
        run: pip install ".[desktop,dev]"

      - name: Bundle the fallback wake word model (hey_jarvis) + feature models
        run: python -c "import openwakeword.utils as u; u.download_models(model_names=['hey_jarvis'])"

      - name: Bundle the "Hey Monkey" keyword-spotting model (sherpa-onnx, ~5 MB int8)
        shell: bash
        run: |
          curl -sL -o kws.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2
          tar xjf kws.tar.bz2
          mkdir -p wakeword/sherpa-kws
          M=sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
          cp $M/tokens.txt $M/bpe.model $M/*.int8.onnx $M/README.md wakeword/sherpa-kws/

      - name: Unit tests (Windows)
        run: pytest -q

      - name: Stamp version
        shell: bash
        run: echo "__version__ = \"$MONKEY_VERSION\"" > monkey/_version.py

      - name: PyInstaller
        run: pyinstaller monkey.spec --noconfirm

      - name: Self-test the built exe
        shell: pwsh
        run: |
          $env:MONKEY_SELFTEST_OUT = "$PWD\selftest.txt"
          $env:MONKEY_SELFTEST_SECRETS = "$PWD\selftest-secrets.dat"
          $p = Start-Process -FilePath "dist\Monkey\Monkey.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
          # Second launch = "after a restart": the DPAPI-encrypted key saved by the first run must still be readable.
          $env:MONKEY_SELFTEST_EXPECT_SAVED = "1"
          $p = Start-Process -FilePath "dist\Monkey\Monkey.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
          Remove-Item selftest-secrets.dat

      # ---- Velopack: auto-updating installer + GitHub Release on every push to main ----
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Fetch previous release (for delta updates)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --outputDir velopack

      - name: Velopack pack
        run: >
          vpk pack --packId Monkey --packVersion ${{ env.MONKEY_VERSION }} --packDir dist/Monkey
          --mainExe Monkey.exe --packTitle Monkey --packAuthors Monkey --icon assets/monkey.ico --outputDir velopack

      - uses: actions/upload-artifact@v4
        with:
          name: MonkeySetup-Velopack
          path: velopack/*Setup.exe

      - name: Publish release (Velopack feed + installer)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir velopack --publish --releaseName "Monkey ${{ env.MONKEY_VERSION }}" --tag v${{ env.MONKEY_VERSION }}
