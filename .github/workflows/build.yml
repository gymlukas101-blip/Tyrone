name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
    # The weekly lessons review only edits this file: no new release for that alone.
    paths-ignore: ["docs/agent-lessons.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to publish releases on tags

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Hashed lockfile: every package and its exact file are pinned (tools/lock.sh regenerates it).
      - run: pip install --require-hashes -r requirements/linux-test-py312.lock
      - run: pip install --no-deps -e .
      - name: Lockfiles match pyproject.toml
        run: python tools/check_lock.py
      - name: Download keyword-spotting model + test audio
        run: |
          curl -sL -o kws.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2
          tar xjf kws.tar.bz2
          mkdir -p wakeword/sherpa-kws
          M=sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
          cp -r $M/tokens.txt $M/bpe.model $M/*.int8.onnx $M/test_wavs wakeword/sherpa-kws/
          mkdir -p wakeword/vad
          curl -sfL -o wakeword/vad/silero_vad.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
      - run: pytest -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci && npm run build && npm test
        working-directory: ui

  windows:
    needs: test
    runs-on: windows-latest
    env:
      # Every build gets a unique, increasing version so Velopack can update installed copies.
      MONKEY_VERSION: 0.3.${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Build UI
        working-directory: ui
        run: npm ci && npm run build

      - name: Install Python dependencies (hashed lockfile)
        run: |
          pip install --require-hashes -r requirements/windows-py312.lock
          pip install --no-deps .

      - name: Bundle the fallback wake word model (hey_jarvis) + feature models
        run: python -c "import openwakeword.utils as u; u.download_models(model_names=['hey_jarvis'])"

      - name: Bundle the "Hey Monkey" keyword-spotting model (sherpa-onnx, ~5 MB int8)
        shell: bash
        run: |
          curl -sL -o kws.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2
          tar xjf kws.tar.bz2
          mkdir -p wakeword/sherpa-kws
          M=sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
          cp $M/tokens.txt $M/bpe.model $M/*.int8.onnx $M/README.md wakeword/sherpa-kws/
          mkdir -p wakeword/vad
          curl -sfL -o wakeword/vad/silero_vad.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx

      - name: Unit tests (Windows)
        run: pytest -q

      - name: Stamp version
        shell: bash
        run: echo "__version__ = \"$MONKEY_VERSION\"" > monkey/_version.py

      - name: Third-party license list
        run: python tools/notices.py THIRD_PARTY_LICENSES.txt

      - name: PyInstaller
        run: pyinstaller monkey.spec --noconfirm

      - name: Self-test the built exe
        shell: pwsh
        run: |
          $env:MONKEY_SELFTEST_OUT = "$PWD\selftest.txt"
          $env:MONKEY_SELFTEST_SECRETS = "$PWD\selftest-secrets.dat"
          $p = Start-Process -FilePath "dist\Monkey\Monkey.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
          # Second launch = "after a restart": the DPAPI-encrypted key saved by the first run must still be readable.
          $env:MONKEY_SELFTEST_EXPECT_SAVED = "1"
          $p = Start-Process -FilePath "dist\Monkey\Monkey.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
          Remove-Item selftest-secrets.dat

      # ---- Velopack: auto-updating installer + GitHub Release on every push to main ----
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "9.0.x"

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Fetch previous release (for delta updates)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --outputDir velopack

      - name: Velopack pack
        run: >
          vpk pack --packId Monkey --packVersion ${{ env.MONKEY_VERSION }} --packDir dist/Monkey
          --mainExe Monkey.exe --packTitle Monkey --packAuthors Monkey --icon assets/monkey.ico --outputDir velopack

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MonkeySetup-Velopack
          path: velopack/*Setup.exe

      - name: Publish release (Velopack feed + installer)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir velopack --publish --releaseName "Monkey ${{ env.MONKEY_VERSION }}" --tag v${{ env.MONKEY_VERSION }}

  # The real built UI in Chromium: accessibility (axe), layout, keyboard, Today view, avatar states and render tiers.
  # Not a gate for the Windows build (a browser hiccup must not block an urgent fix), but its result shows on every run.
  ui-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: pip install --require-hashes -r requirements/linux-test-py312.lock
      - run: pip install --no-deps -e . && pip install "playwright==1.65.2"
      - run: python -m playwright install --with-deps chromium
      - run: npm ci && npm run build
        working-directory: ui
      - name: Browser UI tests
        run: |
          export MONKEY_BROWSER_PATH="$(python -c 'from playwright.sync_api import sync_playwright as s; p = s().start(); print(p.chromium.executable_path); p.stop()')"
          pytest -q tests/test_m4_avatar.py tests/test_m6_ui.py tests/test_sound_off.py tests/test_m1_fixes.py -k "not speaker"

  # Known-vulnerability report for the locked dependencies. Informational: it never blocks a release, so a new
  # advisory can't stop an urgent fix from shipping; read the job summary and update with tools/lock.sh --upgrade.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Python packages (Windows lockfile)
        run: pip-audit --no-deps --disable-pip -r requirements/windows-py312.lock --desc on | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: UI packages
        working-directory: ui
        run: npm audit --omit=dev | tee -a "$GITHUB_STEP_SUMMARY"
