name: voice-test
# Benchmarks the offline voice (Pocket TTS via sherpa-onnx) on a Windows CPU and uploads sample WAVs.
on:
  workflow_dispatch:
  push:
    paths: ["monkey/audio/offline_voice.py", "tools/voice/**", ".github/workflows/voice-test.yml"]

jobs:
  bench:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install numpy httpx sherpa-onnx
      - name: Benchmark (2 threads, like a laptop under load)
        run: python -m tools.voice.bench_pocket --pack voice-pack --out voice-bench --threads 2
      - name: Benchmark (1 thread, worst case)
        run: python -m tools.voice.bench_pocket --pack voice-pack --out voice-bench-1t --threads 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: voice-bench
          path: |
            voice-bench
            voice-bench-1t
            voice-pack/**/*.txt
            voice-pack/**/*.md
