name: voice-test
# Benchmarks the offline voice (Pocket TTS via sherpa-onnx) on a Windows CPU and uploads sample WAVs.
on:
  workflow_dispatch:
  push:
    paths: ["monkey/audio/offline_voice.py", "tools/voice/**", ".github/workflows/voice-test.yml"]

jobs:
  bench:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy httpx sherpa-onnx
      - name: Benchmark (2 threads, like a laptop under load)
        run: python -m tools.voice.bench_pocket --pack voice-pack --out voice-bench --threads 2
      - name: Benchmark (4 threads)
        run: python -m tools.voice.bench_pocket --pack voice-pack --out voice-bench-4t --threads 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-bench
          path: |
            voice-bench
            voice-bench-4t
            voice-pack/**/*.txt
            voice-pack/**/*.md
