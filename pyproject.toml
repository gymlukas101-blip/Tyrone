[project]
name = "monkey"
version = "0.1.0"
description = "Monkey - a Jarvis-style desktop voice assistant"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.10",
  "pydantic>=2.6",
  "httpx>=0.27",
  "keyring>=25",
  "icalendar>=6",
  "recurring-ical-events>=3.3",
  "python-dateutil>=2.9",
  "cryptography>=42",
]

[project.optional-dependencies]
desktop = [
  "pywebview>=5.3",
  "pystray>=0.19",
  "pillow>=10",
  "sounddevice>=0.5",
  "numpy>=1.26",
  "soundfile>=0.12",
  "openwakeword>=0.6",
  "sherpa-onnx>=1.12",
  "sentencepiece>=0.2",
  "faster-whisper>=1.1",
  "keyboard>=0.13",
  "pyttsx3>=2.98",
  "google-api-python-client>=2.150",
  "google-auth-oauthlib>=1.2",
  "garminconnect>=0.3.20",
  "velopack>=1.2",
  "psutil>=5.9",
  "send2trash>=1.8",
  "pywin32>=308; sys_platform == 'win32'",
  # computer tasks: Playwright drives the Edge that ships with Windows (no browser download);
  # pywinauto reads/acts on one picked window through UI Automation.
  "playwright>=1.65",
  "pywinauto>=0.6.9; sys_platform == 'win32'",
  "websockets>=13",          # the local bridge the Monkey for Chrome extension connects to
]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.scripts]
monkey = "monkey.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["monkey*"]

[tool.setuptools.package-data]
monkey = ["brain/*.md", "brain/*.json", "automation/cursor/*.svg", "automation/cursor/*.js",
          "automation/cursor/*.json", "automation/cursor/png/*.png"]
