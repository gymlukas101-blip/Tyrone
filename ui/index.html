<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monkey</title>
    <script>
      /* Boot watchdog (plain script, runs even if the app bundle can't): if the UI hasn't started
         within 12 s, show what went wrong instead of a blank "Starting up…" and send it to monkey.log. */
      (function () {
        var errors = [];
        window.addEventListener("error", function (e) {
          errors.push((e.message || "load error") + (e.filename ? " @ " + e.filename + ":" + e.lineno : "") +
                      (e.target && e.target.src ? " [" + e.target.src + "]" : ""));
        }, true);
        window.addEventListener("unhandledrejection", function (e) { errors.push("promise: " + String(e.reason)); });
        setTimeout(function () {
          if (window.__monkeyBooted) return;
          var info = "UI failed to start. " + (errors.join(" | ") || "No error was reported.") +
                     " | UA: " + navigator.userAgent + " | URL: " + location.href;
          try { window.pywebview && window.pywebview.api && window.pywebview.api.report_ui_error(info); } catch (x) {}
          var el = document.getElementById("stateLabel");
          if (el) {
            el.textContent = "Monkey's screen didn't load. Please close and reopen Monkey; if it keeps happening, " +
                             "send %APPDATA%\\Monkey\\monkey.log to Claude.";
            el.style.cssText = "font:16px Segoe UI, sans-serif;color:#fff;display:block;max-width:640px;margin:24px";
          }
        }, 12000);
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <section id="stage">
        <div id="avatar"></div>
        <div id="status">
          <span id="stateLabel">Starting up…</span>
          <span id="routeChip" title=""></span>
          <span id="convChip" hidden>👂 Listening… say “thanks” or wait to end <button type="button" id="convEnd" title="Stop listening">✕</button></span>
        </div>
        <div id="hint"></div>
      </section>

      <section id="side">
        <header>
          <div class="brand">MONKEY</div>
          <div class="spacer"></div>
          <span id="spend" title="What Monkey's AI (Claude) has cost this month, billed to your Claude key. Most questions cost under 1¢."></span>
          <button id="labBtn" class="icon labeled" title="Avatar Lab: compare Monkey designs" hidden>🧪<small>Lab</small></button>
          <button id="asgBtn" class="icon labeled" title="Your assignments">✓<small>Homework</small></button>
          <button id="healthBtn" class="icon labeled" title="Sleep &amp; heart rate (Garmin)" hidden>♥<small>Health</small></button>
          <button id="newChat" class="icon labeled" title="Start a new conversation (old ones stay in your history)">⟲<small>New chat</small></button>
          <button id="settingsBtn" class="icon labeled" title="Settings">⚙<small>Settings</small></button>
        </header>
        <div id="cards"></div>
        <div id="log"></div>
        <form id="composer" autocomplete="off">
          <div id="importance" role="radiogroup" title="How important is this?">
            <button type="button" data-v="low" title="Quick: fastest answers, costs the least (well under 1¢)">⚡ Quick</button>
            <button type="button" data-v="normal" class="on" title="Auto: Monkey picks quick or careful for each question (usually under 1¢)">Auto</button>
            <button type="button" data-v="high" title="Important: Monkey thinks harder for tricky stuff (costs a bit more, a few cents at most)">★ Important</button>
          </div>
          <div class="row">
            <button type="button" id="mic" title="Push to talk">🎙</button>
            <input id="input" placeholder="Say “Hey Monkey” or type here…" />
            <button id="send" type="submit">Send</button>
          </div>
        </form>
      </section>
    </div>

    <dialog id="settings"></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
